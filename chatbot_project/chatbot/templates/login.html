<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - ChatBot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- External CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="login-left-logo">🤖</div>
            <h2>Welcome to ChatBot</h2>
            <p>Your personal AI assistant is ready to chat, answer questions, and help you anytime!</p>
        </div>
        
        <div class="login-right"> 
            <h1>Sign In</h1>
            <p>Enter your credentials to access your account</p>
            
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}
            
            <form method="POST" id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>
                
                <button type="submit">Sign In</button>
            </form>
            
            <div class="signup-link">
                Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
            </div>
        </div>
    </div>

    <!-- External JS -->
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
